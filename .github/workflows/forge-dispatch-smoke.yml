name: forge-dispatch-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-dispatch-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Agentless dispatch smoke
    if: github.repository == 'vera-rubin/VISION-64' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, vision]
    timeout-minutes: 10
    steps:
      - name: Check out the exact workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run detached mutation-free dispatch
        shell: bash
        env:
          SMOKE_JOB_ID: smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/vision-forge-home-$SMOKE_JOB_ID"
          env -i \
            HOME="$RUNNER_TEMP/vision-forge-home-$SMOKE_JOB_ID" \
            PATH="$PATH" \
            LANG=C.UTF-8 \
            LC_ALL=C \
            ./scripts/forge-dispatch.sh \
              --repo-root "$GITHUB_WORKSPACE" \
              --work-root "$RUNNER_TEMP/vision-forge" \
              --job-id "$SMOKE_JOB_ID" \
              --base-ref "$GITHUB_SHA" \
              --mode smoke \
              --agent none

      - name: Upload deterministic smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge-dispatch-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vision-forge/evidence/smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
