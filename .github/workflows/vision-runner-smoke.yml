name: vision-runner-smoke
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, vision]
    steps:
      - uses: actions/checkout@v4
      - name: Print environment
        run: |
          hostname
          date -u
          rustc --version
          cargo --version
          qemu-system-x86_64 --version
          git status
