name: vision-runner-smoke
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, vision]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Print environment
        run: |
          hostname
          date -u
          rustc --version
          cargo --version
          qemu-system-x86_64 --version
          git status
