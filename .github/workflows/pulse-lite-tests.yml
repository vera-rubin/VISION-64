name: pulse-lite-tests

on:
  push:
    branches:
      - task/6-pulse-lite-micro-loop
    paths:
      - 'tools/pulse-lite/**'
      - '.github/workflows/pulse-lite-tests.yml'
  pull_request:
    paths:
      - 'tools/pulse-lite/**'
      - '.github/workflows/pulse-lite-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install PULSE Lite test dependencies
        working-directory: tools/pulse-lite
        run: python -m pip install -e '.[dev]'
      - name: Compile package
        working-directory: tools/pulse-lite
        run: python -m compileall -q pulse_lite
      - name: Run unit tests
        working-directory: tools/pulse-lite
        run: python -m pytest
