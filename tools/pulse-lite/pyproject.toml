[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-pulse-lite"
version = "0.1.0"
description = "Bounded local wake bridge for VISION-64 chat micro-loops"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.48,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
pulse = "pulse_lite.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pulse_lite*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
